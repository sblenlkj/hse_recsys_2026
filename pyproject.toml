[project]
name = "hse-recsys-solution"
version = "1.0.0"
description = "Воспроизводимое решение HSE RecSys Challenge 2026"
readme = "README.md"
requires-python = ">=3.11,<3.13"
dependencies = [
    "numpy==2.1.3",
    "pandas==2.2.3",
    "scipy==1.14.1",
    "matplotlib==3.9.2",
    "threadpoolctl==3.5.0",
]

[project.optional-dependencies]
sasrec = [
    "pyarrow==18.1.0",
    "replay-rec[torch]==0.22.0",
    "torch>=2.5,<3",
    "lightning==2.5.6",
    "torchmetrics==1.8.2",
]
dev = [
    "nbclient==0.10.2",
    "nbformat==5.10.4",
    "pytest==8.3.5",
]

[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/recsys"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]
